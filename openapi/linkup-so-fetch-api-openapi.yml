openapi: 3.2.0
info:
  title: Linkup Fetch API
  description: Search the web in real time to get trustworthy, source-backed answers. Find the latest news and comprehensive results from the most relevant sources. Use natural language queries to quickly gather facts, citations, and context.
  version: '1.0'
  contact: {}
servers:
- url: https://api.linkup.so
tags:
- name: Fetch
paths:
  /v1/fetch:
    post:
      description: The `/fetch` endpoint allows you to fetch a single webpage from a given URL.
      operationId: fetch
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchInput'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchOutput_Output'
        '400':
          description: Bad Request - Invalid parameters
        '401':
          description: Unauthorized - Invalid or missing API key
        '402':
          description: Payment Required - No API key provided. Returns x402 payment details in the `payment-required` header for pay-per-request with USDC.
        '429':
          description: Too Many Requests - Rate limit exceeded or insufficient credits
      security:
      - bearer: []
      summary: /fetch
      tags:
      - Fetch
components:
  schemas:
    FetchInput:
      type: object
      properties:
        extractImages:
          default: false
          description: Defines whether the API should extract the images from the webpage in its response.
          example: false
          anyOf:
          - type: boolean
          - type: string
        includeRawContent:
          default: false
          description: Defines whether the API should include the raw page content and its content type in the response.
          example: false
          anyOf:
          - type: boolean
          - type: string
        includeRawHtml:
          default: false
          deprecated: true
          description: Deprecated. Use includeRawContent instead. Defines whether rawHtml is returned for non-LinkedIn HTML pages.
          example: false
          anyOf:
          - type: boolean
          - type: string
        renderJs:
          default: false
          description: Defines whether the API should render the JavaScript of the webpage.
          example: false
          anyOf:
          - type: boolean
          - type: string
        mode:
          default: standard
          description: Defines the fetch strategy. Pro fetch delivers significantly higher success rates on hard-to-retrieve pages.
          example: standard
          type: string
          enum:
          - standard
          - pro
        instructions:
          description: Optional instructions that guide how data is extracted. Requires schema.
          example: Use public list prices only and express monetary values in USD.
          type: string
        schema:
          default: null
          format: json
          description: Optional JSON Schema of type object describing the structured data to extract from the page. Fields with no grounded value are omitted, even when marked as required.
        url:
          description: The URL of the webpage you want to fetch.
          example: https://docs.linkup.so
          format: uri
          type: string
      required:
      - url
      id: FetchInput
    FetchOutput_Output:
      type: object
      properties:
        contentType:
          description: The type of rawContent. Present only when rawContent is returned.
          example: html
          type: string
        data:
          description: Structured data extracted from the webpage. Present only when schema is provided; fields with no grounded value are omitted.
          example:
            name: Example product
            price: 49
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
        favicon:
          type: string
          format: uri
          description: The URL of the website favicon.
          example: https://favicons.linkup.so?domain=docs.linkup.so
        images:
          description: List of images extracted from the webpage.
          example:
          - alt: Image 1
            url: https://example.com/image.jpg
          - alt: Image 2
            url: https://example.com/image2.jpg
          type: array
          items:
            $ref: '#/components/schemas/FetchImageOutput_Output'
        markdown:
          type: string
          description: The clean markdown version of the webpage.
          example: Get started for free, no credit card required...
        rawContent:
          description: The raw page content.
          example: <!DOCTYPE html><html lang="en"><head>...</head><body>...</body></html>
          type: string
        rawHtml:
          deprecated: true
          description: The raw HTML version of the webpage.
          example: <!DOCTYPE html><html lang="en"><head>...</head><body>...</body></html>
          type: string
      required:
      - favicon
      - markdown
      additionalProperties: false
      id: FetchOutput_Output
    FetchImageOutput_Output:
      type: object
      properties:
        alt:
          type: string
          description: The alt text of the image.
          example: Image description
        url:
          type: string
          description: The URL of the image.
          example: https://example.com/image.jpg
          format: uri
      required:
      - alt
      - url
      additionalProperties: false
      id: FetchImageOutput_Output
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
x-provenance:
  method: harvested
  publisher: Linkup
  source: https://api.linkup.so/v1/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
